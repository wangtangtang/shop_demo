# CI（持续集成）流水线：每次 push / Pull Request 自动跑 P0 冒烟
#
# 作用：代码一提交，GitHub 就用一台干净的云端机器
#       装依赖 → 跑冒烟测试；任何一条失败 → 页面显示红灯、阻止问题代码合入。
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # config.py 被 .gitignore 忽略、不在仓库里；CI 用模板复制一份（默认 SQLite）
      - name: 准备配置文件
        run: cp config.example.py config.py

      - name: 运行 P0 冒烟测试
        run: |
          pytest test_api/test_smoke_ci.py -v
