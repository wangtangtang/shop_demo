{% extends "base.html" %}
{% block title %}登录 - 极客商城{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h1>欢迎回来</h1>
        <p class="auth-subtitle">登录后开始购物</p>

        <form id="login-form" onsubmit="return doLogin(event)">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" placeholder="至少3位字符" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="至少6位字符" required>
            </div>
            <div class="form-error" id="login-error"></div>
            <button type="submit" class="btn-primary btn-block">登 录</button>
        </form>

        <div class="auth-divider">
            <span>还没有账号？<a href="/register" style="color:var(--primary);text-decoration:none;font-weight:600;">立即注册</a></span>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
