{% extends "base.html" %}
{% block title %}我的订单 - 极客商城{% endblock %}

{% block content %}
<style>
    /* 分页栏（与后台共用 renderPager，这里补页面样式） */
    .pager-bar { display: none; justify-content: space-between; align-items: center;
        gap: 12px; flex-wrap: wrap; margin-top: 16px; padding: 10px 4px;
        font-size: 13px; color: #636e72; }
    .pager-info { font-weight: 600; color: #2d3436; }
    .pager-sizes button, .pager-pages button {
        margin: 0 2px; padding: 4px 10px; border: 1px solid #dfe6e9; background: #fff;
        border-radius: 6px; cursor: pointer; font-size: 13px; color: #636e72; }
    .pager-sizes button.active, .pager-pages button.active {
        background: #0984e3; border-color: #0984e3; color: #fff; font-weight: 700; }
    .pager-pages button.disabled { opacity: .45; cursor: not-allowed; }
    .pager-pages button:not(.active):not(:disabled):hover { border-color: #0984e3; color: #0984e3; }
    .pager-dots { margin: 0 4px; color: #b2bec3; }
    /* 收货地址（下单快照） */
    .order-addr { font-size: 13.5px; color: #2d3436; padding: 8px 0; border-bottom: 1px dashed #f0f0f0; }
    .order-addr-detail { color: #636e72; margin-left: 6px; }
    /* 物流信息 + 纵向时间线（最新在最上） */
    .order-logistics { margin-top: 10px; background: #f7fbff; border: 1px solid #e3effb;
        border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #2d3436; }
    .track-timeline { margin-top: 10px; padding-left: 2px; }
    .track-item { position: relative; padding: 0 0 14px 20px; border-left: 2px solid #dfe6e9; margin-left: 6px; }
    .track-item:last-child { border-left-color: transparent; padding-bottom: 0; }
    .track-dot { position: absolute; left: -7px; top: 2px; width: 12px; height: 12px; border-radius: 50%;
        background: #b2bec3; border: 2px solid #fff; box-shadow: 0 0 0 1px #dfe6e9; }
    .track-item.latest .track-dot { background: #0984e3; box-shadow: 0 0 0 1px #0984e3; }
    .track-status { font-size: 13.5px; font-weight: 600; color: #2d3436; }
    .track-item.latest .track-status { color: #0984e3; }
    .track-now { display: inline-block; font-size: 11px; font-weight: 500; color: #fff; background: #0984e3;
        border-radius: 8px; padding: 0 6px; margin-left: 6px; vertical-align: middle; }
    .track-info { font-size: 12.5px; color: #636e72; margin-top: 2px; }
    .track-time { font-size: 12px; color: #b2bec3; margin-top: 2px; }
    .track-loading { font-size: 12.5px; color: #b2bec3; padding: 2px 0; }

    /* ===== 售后状态条（物流区块附近；黄=审核中 绿=已同意 红=已拒绝） ===== */
    .order-aftersale { margin-top: 10px; border-radius: 8px; padding: 9px 12px;
        font-size: 13px; line-height: 1.6; }
    .order-aftersale.as-pending  { background: #fff8e6; border: 1px solid #ffe08a; color: #8a6d1a; }
    .order-aftersale.as-approved { background: #eafaf3; border: 1px solid #b5e8d0; color: #0b7a4b; }
    .order-aftersale.as-rejected { background: #fff0f0; border: 1px solid #ffc9c9; color: #c0392b; }
    .as-tag { display: inline-block; padding: 2px 10px; border-radius: 20px;
        color: #fff; font-size: 12px; font-weight: 600; margin-right: 2px; }
    .as-pending  .as-tag { background: #ffa502; }
    .as-approved .as-tag { background: #00b894; }
    .as-rejected .as-tag { background: #ff4757; }
    .as-type { font-weight: 600; }
    .as-extra { font-size: 12.5px; margin-top: 3px; opacity: .9; }

    /* ===== 申请售后弹窗（样式与后台发货弹窗一致） ===== */
    .modal-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
        z-index: 999; align-items: center; justify-content: center; }
    .modal-mask.show { display: flex; }
    .modal-box { background: #fff; border-radius: 12px; padding: 22px 24px; width: 400px;
        max-width: calc(100vw - 40px); box-shadow: 0 10px 40px rgba(0,0,0,.2); }
    .modal-box h3 { margin: 0 0 14px; font-size: 17px; color: #2d3436; }
    .modal-box .form-group { margin-bottom: 14px; }
    .modal-box label { display: block; font-size: 13px; font-weight: 600; color: #2d3436; margin-bottom: 6px; }
    .modal-box textarea {
        width: 100%; padding: 9px 12px; border: 1px solid #dfe6e9; border-radius: 6px;
        font-size: 14px; box-sizing: border-box; resize: vertical; min-height: 76px;
        font-family: inherit; }
    .modal-foot { text-align: right; margin-top: 18px; }
    .modal-foot button { margin-left: 8px; }
    /* 售后类型三选一按钮 */
    .as-type-group { display: flex; gap: 8px; }
    .as-type-btn { flex: 1; padding: 8px 0; border: 1px solid #dfe6e9; background: #fff;
        border-radius: 6px; cursor: pointer; font-size: 13.5px; color: #636e72; }
    .as-type-btn.active { background: #0984e3; border-color: #0984e3; color: #fff; font-weight: 700; }

    /* 订单搜索条（回车 / 按钮都触发；清空输入再搜即恢复全量） */
    .order-search { display: flex; gap: 8px; margin-bottom: 14px; }
    .order-search input {
        padding: 9px 14px; border: 1px solid #dfe6e9; border-radius: 8px;
        font-size: 14px; width: 260px; max-width: 70vw; box-sizing: border-box;
    }
    .order-search input:focus { outline: none; border-color: #0984e3; }

    /* ===== 商品评价（completed 订单：评价按钮 / 已评价星级） ===== */
    .order-review { margin-top: 10px; padding: 9px 12px; border-radius: 8px;
        background: #fffbf0; border: 1px solid #ffe9b8; font-size: 13.5px;
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: #8a6d1a; }
    .rv-stars { color: #faad14; font-size: 17px; letter-spacing: 2px; }
    .rv-score { font-weight: 700; color: #d48806; }
    /* 弹窗里的点选星星（可点击，未选灰色，选中/悬停金色） */
    .rv-picker { font-size: 30px; letter-spacing: 6px; user-select: none; }
    .rv-picker .star-item { color: #dfe6e9; cursor: pointer; transition: color .1s; }
    .rv-picker .star-item.on { color: #faad14; }
    .rv-tip { font-size: 12.5px; color: #b2bec3; margin-left: 8px; }
    .rv-counter { text-align: right; font-size: 12px; color: #b2bec3; margin-top: 4px; }
    .rv-view-products { font-size: 12.5px; color: #636e72; background: #f5f6fa;
        border-radius: 6px; padding: 6px 10px; margin: 8px 0; }
    .rv-view-content { font-size: 14px; color: #2d3436; line-height: 1.7;
        white-space: pre-wrap; word-break: break-all; margin: 8px 0; }
    .rv-view-time { font-size: 12.5px; color: #b2bec3; }
</style>

<h1 class="page-title">我的订单</h1>
<form class="order-search" onsubmit="searchMyOrders();return false;">
    <input id="order-keyword" type="text" placeholder="搜索订单号或商品名"
           onkeydown="if(event.key==='Enter'){event.preventDefault();searchMyOrders();}">
    <button type="submit" class="btn-primary">搜索</button>
</form>
<div id="order-list" class="order-list">
    <div class="loading">加载中...</div>
</div>
<div class="pager-bar" id="order-pager"></div>

<!-- 申请售后弹窗：选择售后类型 + 填写原因（已发货订单、确认收货前可申请） -->
<div class="modal-mask" id="aftersale-modal">
    <div class="modal-box">
        <h3>申请售后</h3>
        <div class="form-group">
            <label>售后类型 <span style="color:#ff4757">*</span></label>
            <div class="as-type-group">
                <button type="button" class="as-type-btn active" data-type="refund_return"
                        onclick="pickAfterSaleType('refund_return', this)">退货退款</button>
                <button type="button" class="as-type-btn" data-type="exchange"
                        onclick="pickAfterSaleType('exchange', this)">换货</button>
                <button type="button" class="as-type-btn" data-type="price_protect"
                        onclick="pickAfterSaleType('price_protect', this)">价保</button>
            </div>
        </div>
        <div class="form-group">
            <label>申请原因 <span style="color:#ff4757">*</span></label>
            <textarea id="as-reason" placeholder="请描述遇到的问题，如：商品有划痕、尺码不合适、商品降价等"></textarea>
        </div>
        <div class="modal-foot">
            <button class="btn-secondary" onclick="closeAfterSaleModal()">取消</button>
            <button class="btn-primary" onclick="submitAfterSale()">提交申请</button>
        </div>
    </div>
</div>

<!-- 发表评价弹窗：星星点选（1-5，必须选）+ 评价内容（必填，最多500字） -->
<div class="modal-mask" id="review-modal">
    <div class="modal-box">
        <h3>发表评价</h3>
        <div class="form-group">
            <label>商品评分 <span style="color:#ff4757">*</span></label>
            <div class="rv-picker" id="rv-picker">
                <span class="star-item" data-star="1" onclick="pickReviewStar(1)">★</span><span class="star-item" data-star="2" onclick="pickReviewStar(2)">★</span><span class="star-item" data-star="3" onclick="pickReviewStar(3)">★</span><span class="star-item" data-star="4" onclick="pickReviewStar(4)">★</span><span class="star-item" data-star="5" onclick="pickReviewStar(5)">★</span>
                <span class="rv-tip" id="rv-pick-tip">点击星星打分</span>
            </div>
        </div>
        <div class="form-group">
            <label>评价内容 <span style="color:#ff4757">*</span></label>
            <textarea id="rv-content" maxlength="500" placeholder="说说商品质量、使用感受吧（1-500字）"
                      oninput="updateReviewCounter()"></textarea>
            <div class="rv-counter"><span id="rv-count">0</span>/500</div>
        </div>
        <div class="modal-foot">
            <button class="btn-secondary" onclick="closeReviewModal()">取消</button>
            <button class="btn-primary" onclick="submitReview()">提交评价</button>
        </div>
    </div>
</div>

<!-- 查看评价弹窗：已评价订单展示自己的星级/内容/时间/购买商品快照 -->
<div class="modal-mask" id="review-view-modal">
    <div class="modal-box">
        <h3>我的评价</h3>
        <div id="rv-view-body"></div>
        <div class="modal-foot">
            <button class="btn-primary" onclick="closeReviewViewModal()">关闭</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/orders.js') }}"></script>
{% endblock %}
