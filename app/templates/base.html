<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}极客商城{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="logo" onerror="this.style.display='none'">
                <span>极客商城</span>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link">首页</a>
                <a href="/cart" class="nav-link">
                    购物车
                    <span class="cart-badge" id="cart-badge" style="display:none">0</span>
                </a>
                <div id="user-area">
                    <button class="btn-login" onclick="location.href='/login'">登录</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>© 2026 极客商城 · Flask 电商测试 Demo</p>
    </footer>

    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <!-- AI 智能客服悬浮窗（全站页面生效） -->
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
