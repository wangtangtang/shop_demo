{% extends "base.html" %}
{% block title %}注册 - 极客商城{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h1>创建账号</h1>
        <p class="auth-subtitle">注册后即可开始购物</p>

        <form id="register-form" onsubmit="return doRegister(event)">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="reg-username" placeholder="设置用户名（至少3位字符）" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="reg-password" placeholder="设置密码（至少6位字符）" required>
            </div>
            <div class="form-error" id="register-error"></div>
            <button type="submit" class="btn-primary btn-block">注 册</button>
        </form>

        <div class="auth-divider">
            <span>已有账号？<a href="/login" style="color:var(--primary);text-decoration:none;font-weight:600;">去登录</a></span>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
