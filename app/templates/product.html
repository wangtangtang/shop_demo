{% extends "base.html" %}
{% block title %}商品详情 - 极客商城{% endblock %}

{% block content %}
<style>
    /* ===== 商品详情页专用样式（只在这个页面生效） ===== */
    .detail-wrap {
        display: flex; gap: 30px; background: #fff; border-radius: 12px;
        padding: 28px; box-shadow: 0 2px 12px rgba(0,0,0,.06);
        align-items: flex-start; flex-wrap: wrap;
    }
    /* 轮播图 */
    .gallery { flex: 0 0 420px; max-width: 420px; width: 100%; }
    .carousel {
        position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 10px;
        overflow: hidden; background: #f5f6fa; border: 1px solid #f1f2f6;
    }
    .carousel-track {
        display: flex; width: 100%; height: 100%;
        transition: transform .35s ease;
    }
    .carousel-slide {
        flex: 0 0 100%; height: 100%; display: flex;
        align-items: center; justify-content: center;
    }
    .carousel-slide img { width: 100%; height: 100%; object-fit: contain; }
    .carousel-arrow {
        position: absolute; top: 50%; transform: translateY(-50%);
        width: 38px; height: 38px; border: none; border-radius: 50%;
        background: rgba(255,255,255,.9); color: #2d3436; font-size: 18px;
        cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.15); z-index: 2;
        line-height: 38px; text-align: center; padding: 0;
    }
    .carousel-arrow:hover { background: #fff; color: #0984e3; }
    .carousel-arrow.prev { left: 10px; }
    .carousel-arrow.next { right: 10px; }
    .carousel-dots {
        position: absolute; bottom: 12px; left: 0; right: 0;
        display: flex; justify-content: center; gap: 7px; z-index: 2;
    }
    .carousel-dot {
        width: 9px; height: 9px; border-radius: 50%; border: none; padding: 0;
        background: rgba(255,255,255,.65); cursor: pointer;
        box-shadow: 0 0 0 1px rgba(0,0,0,.08);
    }
    .carousel-dot.active { background: #0984e3; }

    /* 商品信息区 */
    .detail-info { flex: 1; min-width: 280px; }
    .detail-name { font-size: 24px; font-weight: 700; color: #2d3436; margin: 0 0 10px; }
    .detail-price {
        font-size: 30px; font-weight: 800; color: #ff4757;
        background: #fff5f6; border-radius: 8px; padding: 12px 16px; margin: 14px 0;
    }
    .detail-meta { font-size: 14px; color: #636e72; margin: 10px 0; }
    .stock-tag { display: inline-block; padding: 2px 12px; border-radius: 14px;
        font-size: 13px; font-weight: 600; color: #fff; }
    .stock-tag.in { background: #00b894; }
    .stock-tag.out { background: #b2bec3; }
    .qty-row { display: flex; align-items: center; gap: 10px; margin: 18px 0; }
    .qty-row label { font-size: 14px; color: #2d3436; font-weight: 600; }
    .qty-stepper { display: flex; align-items: center; border: 1px solid #dfe6e9; border-radius: 8px; overflow: hidden; }
    .qty-stepper button {
        width: 34px; height: 34px; border: none; background: #f8f9fb;
        font-size: 17px; cursor: pointer; color: #2d3436;
    }
    .qty-stepper button:hover:not(:disabled) { background: #eef5ff; color: #0984e3; }
    .qty-stepper button:disabled { color: #dfe6e9; cursor: not-allowed; }
    .qty-stepper input {
        width: 52px; height: 34px; border: none; border-left: 1px solid #dfe6e9;
        border-right: 1px solid #dfe6e9; text-align: center; font-size: 15px; padding: 0;
    }
    .detail-actions { display: flex; gap: 12px; margin-top: 20px; }
    .detail-desc {
        margin-top: 26px; background: #fff; border-radius: 12px; padding: 22px 28px;
        box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }
    .detail-desc h3 { font-size: 17px; margin: 0 0 12px; color: #2d3436; }
    .desc-text {
        font-size: 14.5px; color: #636e72; line-height: 1.9; white-space: pre-wrap;
    }

    /* ===== 商品评价区（游客可见：汇总头部 + 评价列表 + 分页加载更多） ===== */
    .review-section {
        margin-top: 26px; background: #fff; border-radius: 12px; padding: 22px 28px;
        box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }
    .review-section h3 { font-size: 17px; margin: 0 0 16px; color: #2d3436; }
    .review-summary { display: flex; gap: 36px; align-items: center; flex-wrap: wrap;
        background: #fffbf0; border: 1px solid #ffe9b8; border-radius: 10px;
        padding: 16px 20px; margin-bottom: 18px; }
    .rs-avg { text-align: center; }
    .rs-avg-num { font-size: 34px; font-weight: 800; color: #fa8c16; line-height: 1.1; }
    .rs-avg-stars { color: #faad14; font-size: 16px; letter-spacing: 2px; margin-top: 2px; }
    .rs-meta { font-size: 13.5px; color: #636e72; line-height: 1.9; }
    .rs-meta b { color: #2d3436; font-size: 15px; }
    .rs-dist { flex: 1; min-width: 240px; }
    .rs-dist-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px;
        color: #636e72; margin: 3px 0; }
    .rs-dist-row .rs-label { width: 38px; flex: 0 0 38px; }
    .rs-bar { flex: 1; height: 8px; background: #f1f2f6; border-radius: 5px; overflow: hidden; }
    .rs-bar i { display: block; height: 100%; background: #faad14; border-radius: 5px;
        transition: width .3s; }
    .rs-count { width: 34px; flex: 0 0 34px; text-align: right; }
    .review-item { padding: 14px 2px; border-bottom: 1px dashed #f0f0f0; }
    .review-item:last-child { border-bottom: none; }
    .review-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .review-user { font-size: 13.5px; font-weight: 600; color: #2d3436; }
    .review-stars { color: #faad14; font-size: 14px; letter-spacing: 1px; }
    .review-time { font-size: 12px; color: #b2bec3; margin-left: auto; }
    .review-products { font-size: 12.5px; color: #636e72; margin-top: 5px; }
    .review-content { font-size: 14px; color: #2d3436; line-height: 1.75;
        margin-top: 5px; word-break: break-all; }
    .review-more { text-align: center; margin-top: 16px; }
</style>

<div id="detail-box">
    <div class="loading" style="padding:60px 0;text-align:center">加载中...</div>
</div>

<!-- 商品评价区：汇总（平均分/评价数/好评率/星级分布）+ 评价列表，游客可看 -->
<div class="review-section" id="review-section" style="display:none">
    <h3>商品评价</h3>
    <div id="review-summary"></div>
    <div id="review-list"></div>
    <div class="review-more" id="review-more"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/product.js') }}"></script>
{% endblock %}
